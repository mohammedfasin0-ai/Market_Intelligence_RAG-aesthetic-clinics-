name: Run Headful Scrapers

on:
  schedule:
    - cron: '30 11 * * *''  # Runs every day at 00:00 UTC
  workflow_dispatch:      # Allows manual trigger from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:  # <--- Moving it here makes it global for all steps!
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YT_TRANSCRIPT_API: ${{ secrets.YT_TRANSCRIPT_API }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.6'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Reddit Scraper
        working-directory: ./collectors/reddit
        run: xvfb-run --auto-servernum python main.py

      - name: Run News Feed Scraper
        working-directory: "./collectors/News Feed"
        run: xvfb-run --auto-servernum python main.py

      - name: Run YouTube Scraper
        working-directory: ./collectors/youtube
        run: xvfb-run --auto-servernum python amspa_podcasts.py

      - name: Run Normalizer
        working-directory: ./collectors
        run: xvfb-run --auto-servernum python normalizer.py

      - name: Embedding
        working-directory: "./collectors/News Feed"
        run: xvfb-run --auto-servernum python embedding.py
